<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSNT — LinkedIn Posts Public Sector Data &amp; KI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="mast">
      <div>
        <p class="kicker">OSNT · LinkedIn OSINT</p>
        <h1>Posts zu Data Platforms &amp; KI im Public Sector</h1>
      </div>
      <p class="legal">
        Acht Firmen, Personen in Data/AI, Kunden und Projekte aus deren Posts.
        Sammlung über HarvestAPI/Bright Data/Google — kein Login bei LinkedIn.
      </p>
    </header>

    <section class="toolbar">
      <label>
        Firma
        <select id="company"><option value="">Alle</option></select>
      </label>
      <label class="grow">
        Suche in Posts
        <input id="q" type="search" placeholder="ITZBund, Datenplattform, Name…" />
      </label>
      <button type="button" id="btn-demo">Demo-Posts laden</button>
      <button type="button" id="btn-apify">Apify scrapen</button>
      <button type="button" id="btn-serper">Google/Serper</button>
    </section>
    <p id="status" class="status" hidden></p>

    <section id="kpis" class="kpis"></section>
    <section id="bars" class="bars"></section>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="posts">Posts</button>
      <button type="button" class="tab" data-tab="people">Personen</button>
      <button type="button" class="tab" data-tab="customers">Kunden</button>
      <button type="button" class="tab" data-tab="projects">Projekte</button>
      <button type="button" class="tab" data-tab="costs">Kosten</button>
    </nav>

    <section id="panel-posts" class="panel"></section>
    <section id="panel-people" class="panel" hidden></section>
    <section id="panel-customers" class="panel" hidden></section>
    <section id="panel-projects" class="panel" hidden></section>
    <section id="panel-costs" class="panel" hidden></section>

    <script src="/static/app.js"></script>
  </body>
</html>
